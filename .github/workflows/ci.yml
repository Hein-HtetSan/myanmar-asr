name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research site
        run: |
          node --check web/app.js
          python scripts/deploy/build_research_site.py
      - name: Parse Python scripts
        run: python -m compileall -q scripts
      - name: Run repository and notebook checks
        run: |
          python -m pip install soundfile
          python -m unittest discover -s tests -v
      - name: Validate service Compose file
        env:
          LABEL_STUDIO_USERNAME: test
          LABEL_STUDIO_PASSWORD: test
          POSTGRES_PASSWORD: test
          ARGILLA_USERNAME: test
          ARGILLA_PASSWORD: test
          ARGILLA_API_KEY: test
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: test
        run: docker compose -f services/docker-compose.yml config --quiet
      - name: Validate notebook MLflow Compose file
        run: docker compose -f services/mlflow-notebooks.compose.yml config --quiet
