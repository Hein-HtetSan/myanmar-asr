name: Repository checks

on:
  push:
  pull_request:

jobs:
  source-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Parse Python scripts
        run: python -m compileall -q scripts
      - name: Validate service Compose file
        env:
          LABEL_STUDIO_USERNAME: test
          LABEL_STUDIO_PASSWORD: test
          POSTGRES_PASSWORD: test
          ARGILLA_USERNAME: test
          ARGILLA_PASSWORD: test
          ARGILLA_API_KEY: test
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: test
        run: docker compose -f services/docker-compose.yml config --quiet
