name: myanmar-asr-notebooks

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "127.0.0.1:${MLFLOW_NOTEBOOK_PORT:-5050}:5000"
    volumes:
      - mlflow_notebook_data:/mlflow
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  mlflow_notebook_data:
