# ─────────────────────────────────────────────
#  Myanmar ASR — Local Services Stack
#  Docker selects each image's native host architecture.
# ─────────────────────────────────────────────

services:

  # ── Label Studio (Audio Annotation) ──────────────────
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    ports:
      - "8081:8080"
    volumes:
      - ./label_studio_data:/label-studio/data
      - ../exports:/label-studio/files  # Mount audio exports
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME:?Set LABEL_STUDIO_USERNAME in .env}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD:?Set LABEL_STUDIO_PASSWORD in .env}
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
      - DJANGO_DB=default
      - POSTGRE_NAME=labelstudio
      - POSTGRE_USER=labelstudio
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Argilla (ML Team Dataset Review) ─────────────────
  argilla:
    image: argilla/argilla-quickstart:latest
    container_name: argilla
    ports:
      - "6900:6900"
    volumes:
      - argilla_data:/var/lib/postgresql/data
      - argilla_elasticsearch:/usr/share/elasticsearch/data
    environment:
      - ARGILLA_HOME_PATH=/var/lib/argilla
      - ARGILLA_SERVER_WORKERS=2
      - OWNER_USERNAME=${ARGILLA_USERNAME:?Set ARGILLA_USERNAME in .env}
      - OWNER_PASSWORD=${ARGILLA_PASSWORD:?Set ARGILLA_PASSWORD in .env}
      - OWNER_API_KEY=${ARGILLA_API_KEY:?Set ARGILLA_API_KEY in .env}
    restart: unless-stopped

  # ── PostgreSQL (Database for Label Studio) ───────────
  postgres:
    image: postgres:15-alpine
    container_name: asr-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=labelstudio
      - POSTGRES_USER=labelstudio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelstudio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible local storage for audio + MLflow artifacts) ──
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: asr-minio
    ports:
      - "9002:9000"    # API (host 9002 → container 9000; port 9000 has macOS forwarding issues)
      - "9001:9001"    # Web Console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      - MINIO_ADDRESS=:9000
      - MINIO_CONSOLE_ADDRESS=:9001
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped

  # ── MinIO Init (create buckets on startup) ──────────
  minio-init:
    image: minio/mc:latest
    container_name: asr-minio-init
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb local/mlflow-artifacts --ignore-existing;
      mc mb local/myanmar-asr-data --ignore-existing;
      echo 'MinIO buckets created';
      "

  # ── MLflow (Experiment Tracking) ─────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: asr-mlflow
    ports:
      - "5050:5050"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5050
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root s3://mlflow-artifacts/
    depends_on:
      - minio
    restart: unless-stopped

  # ── Redis (Task queue / caching) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: asr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  argilla_data:
  argilla_elasticsearch:
  minio_data:
  mlflow_data:
  redis_data:
  label_studio_data:
